[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optics-sim-lab"
version = "1.0.0"
description = "Shared simulation framework for diffraction, Talbot, off-axis holography and coherent Abbe imaging"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "Pillow>=10", "LightPipes==2.1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
optics-sim = "optics_sim.cli:main"

[tool.setuptools.packages.find]
include = ["optics_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
